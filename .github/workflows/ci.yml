name: CI

on:
  workflow_dispatch:

env:
  BUN_CACHE_DIR: .bun-cache
  CARGO_HOME: src-tauri/.cargo

jobs:
  secrets-scanning:
    name: Secrets scanning
    runs-on: ubuntu-latest
    container:
      image: oven/bun:1.3.9
    steps:
      - uses: actions/checkout@v4
      - name: Run secret scanning
        run: bun run scripts/check_secrets.ts

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    container:
      image: oven/bun:1.3.9
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: bun install --frozen-lockfile --cache-dir $BUN_CACHE_DIR
      - name: Build frontend
        run: bun run build
      - name: Upload frontend dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/
          retention-days: 1

  frontend-governance:
    name: Frontend governance
    runs-on: ubuntu-latest
    container:
      image: oven/bun:1.3.9
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: bun install --frozen-lockfile --cache-dir $BUN_CACHE_DIR
      - name: Run frontend checks
        run: bun run check
      - name: Run Vitest
        run: bun x vitest run

  backend-governance:
    name: Backend governance
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/atoxyd/grpc-tauri:ci-latest
    needs: frontend-build
    steps:
      - uses: actions/checkout@v4
      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist

      - name: Cargo fmt check
        run: cargo fmt --check
        working-directory: src-tauri
      - name: Cargo clippy
        run: cargo clippy -- -D warnings
        working-directory: src-tauri
      - name: Cargo check
        run: cargo check
        working-directory: src-tauri
      - name: Free disk space before test
        run: |
          df -h
          rm -rf target/debug/incremental
          rm -rf dist
        working-directory: src-tauri
      - name: Cargo test
        run: cargo test --verbose
        working-directory: src-tauri
        env:
          RUSTFLAGS: -C link-args=-fuse-ld=mold

  architectural-governance:
    name: Architectural governance
    runs-on: ubuntu-latest
    container:
      image: oven/bun:1.3.9
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: bun install --frozen-lockfile --cache-dir $BUN_CACHE_DIR
      - name: Run architecture checks
        run: bun run check:arch

  bun-dependency-audit:
    name: Bun dependency audit
    runs-on: ubuntu-latest
    container:
      image: oven/bun:1.3.9
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Run bun audit
        run: bun audit

  cargo-dependency-audit:
    name: Cargo dependency audit
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/atoxyd/grpc-tauri:ci-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
        working-directory: src-tauri
      - name: Run cargo audit
        run: cargo audit --ignore RUSTSEC-2025-0080 --ignore RUSTSEC-2025-0100 --ignore RUSTSEC-2025-0098 --ignore RUSTSEC-2024-0429
        working-directory: src-tauri

  documentation-governance:
    name: Documentation governance
    runs-on: ubuntu-latest
    container:
      image: oven/bun:1.3.9
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: bun install --frozen-lockfile --cache-dir $BUN_CACHE_DIR
      - name: Run documentation governance
        run: bun run scripts/check_docs_governance.ts

  release-integrity:
    name: Release integrity
    runs-on: ubuntu-latest
    container:
      image: oven/bun:1.3.9
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: bun install --frozen-lockfile --cache-dir $BUN_CACHE_DIR
      - name: Run release integrity check
        run: bun run scripts/check_release_integrity.ts

  runtime-e2e-governance:
    name: Runtime E2E governance
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/atoxyd/grpc-tauri:ci-latest
    needs: frontend-build
    if: github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.base_ref == 'main')
    steps:
      - uses: actions/checkout@v4
      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist
      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium
      - name: Install dependencies
        run: bun install --frozen-lockfile --cache-dir $BUN_CACHE_DIR
      - name: Build src-tauri
        run: cd src-tauri && cargo build
      - name: Run Playwright E2E tests
        run: |
          export TEST_SECURE_TEMP_DIR="$(mktemp -d)"
          bun run test:e2e
          rm -rf "$TEST_SECURE_TEMP_DIR"
