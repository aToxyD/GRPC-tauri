name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

env:
  BUN_CACHE_DIR: .bun-cache
  CARGO_HOME: src-tauri/.cargo

jobs:
  secrets-scanning:
    name: Secrets scanning
    runs-on: ubuntu-latest
    container:
      image: oven/bun:1.3.9
    steps:
      - uses: actions/checkout@v4
      - name: Run secret scanning
        run: bun run scripts/check_secrets.ts

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    container:
      image: oven/bun:1.3.9
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: bun install --frozen-lockfile --cache-dir $BUN_CACHE_DIR
      - name: Build frontend
        run: bun run build
      - name: Upload frontend dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/
          retention-days: 1

  frontend-governance:
    name: Frontend governance
    runs-on: ubuntu-latest
    container:
      image: oven/bun:1.3.9
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: bun install --frozen-lockfile --cache-dir $BUN_CACHE_DIR
      - name: Run frontend checks
        run: bun run check
      - name: Run Vitest
        run: bun x vitest run

  backend-governance:
    name: Backend governance
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/atoxyd/grpc-tauri:ci-latest
    needs: frontend-build
    steps:
      - uses: actions/checkout@v4
      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist

      - name: Cargo fmt check
        run: cargo fmt --check
        working-directory: src-tauri
      - name: Cargo clippy
        run: cargo clippy -- -D warnings
        working-directory: src-tauri
      - name: Cargo check
        run: cargo check
        working-directory: src-tauri
      - name: Free disk space before test
        run: |
          df -h
          cargo clean -p grpc 2>/dev/null || true
          rm -rf target/debug/incremental
        working-directory: src-tauri
      - name: Cargo test
        run: cargo test --verbose
        working-directory: src-tauri
        env:
          RUSTFLAGS: -C link-args=-fuse-ld=mold

  architectural-governance:
    name: Architectural governance
    runs-on: ubuntu-latest
    container:
      image: oven/bun:1.3.9
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: bun install --frozen-lockfile --cache-dir $BUN_CACHE_DIR
      # Generate governance observability reports first (gitignored artifacts
      # required by the FE-165 release gate, e.g. GOVERNANCE_COVERAGE_REPORT.md).
      # Must use the standalone generator entry point, not `check:obs`: the
      # governance engine runs the invariant scanners BEFORE it generates the
      # reports, so on a clean checkout `check:obs` always self-reports FE-165
      # ("GOVERNANCE_COVERAGE_REPORT.md file missing") and exits 1. Generation
      # therefore has to be its own step; the architecture check below still
      # enforces FE-165 against the generated artifact.
      - name: Generate governance observability reports
        run: bun scripts/governance/observability/index.ts
      - name: Run architecture checks
        run: bun run check:arch

  bun-dependency-audit:
    name: Bun dependency audit
    runs-on: ubuntu-latest
    container:
      image: oven/bun:1.3.9
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Run bun audit
        run: bun audit

  cargo-dependency-audit:
    name: Cargo dependency audit
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/atoxyd/grpc-tauri:ci-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
        working-directory: src-tauri
      - name: Run cargo audit
        run: cargo audit --ignore RUSTSEC-2025-0080 --ignore RUSTSEC-2025-0100 --ignore RUSTSEC-2025-0098 --ignore RUSTSEC-2024-0429
        working-directory: src-tauri

  documentation-governance:
    name: Documentation governance
    runs-on: ubuntu-latest
    container:
      image: oven/bun:1.3.9
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: bun install --frozen-lockfile --cache-dir $BUN_CACHE_DIR
      - name: Run documentation governance
        run: bun run scripts/check_docs_governance.ts

  release-integrity:
    name: Release integrity
    runs-on: ubuntu-latest
    container:
      image: oven/bun:1.3.9
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: bun install --frozen-lockfile --cache-dir $BUN_CACHE_DIR
      - name: Run release integrity check
        run: bun run scripts/check_release_integrity.ts

  # CI-E2E: browser-level coverage (ViteDriver against `bun run dev`) on Linux.
  # This is NOT a substitute for A2 release-binary certification, which runs the
  # real Tauri Release binary via WebKitWebDriver (see ci_governance_audit.md §7).
  runtime-e2e-governance:
    name: Runtime E2E governance
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/atoxyd/grpc-tauri:ci-latest
    needs: frontend-build
    if: github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.base_ref == 'main')
    steps:
      - uses: actions/checkout@v4
      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist
      # Dependencies MUST be installed before the Playwright browsers.
      # `bunx playwright` resolves the local, lockfile-pinned @playwright/test
      # only when node_modules exists; otherwise it downloads the latest
      # playwright from the registry, which installs a different chromium
      # revision than the pinned runner expects.
      - name: Install dependencies
        run: bun install --frozen-lockfile --cache-dir $BUN_CACHE_DIR
      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium
      - name: Build src-tauri
        run: cd src-tauri && cargo build
      - name: Run Playwright E2E tests
        run: |
          export TEST_SECURE_TEMP_DIR="$(mktemp -d)"
          bun run test:e2e
          rm -rf "$TEST_SECURE_TEMP_DIR"

  # CI-E2E (Windows): real Tauri debug binary via TauriDriver + WebView2 CDP.
  # Windows cannot run the ci-latest Linux container, so this job runs directly
  # on the hosted runner (preinstalled Rust + WebView2 runtime). TauriDriver
  # attaches to the app's WebView2 over CDP, so no Playwright browser download
  # is required (unlike the Linux job, which uses ViteDriver + chromium).
  # Scope: only the runtime specs validated on the native Windows build.
  #   - security.spec.ts is excluded by design (Linux Release binary +
  #     WebKitWebDriver stack, see ADR-0041).
  #   - runtime_stability.spec.ts is a ViteDriver UI-only spec.
  runtime-e2e-governance-windows:
    name: Runtime E2E governance (Windows)
    runs-on: windows-latest
    needs: frontend-build
    if: github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.base_ref == 'main')
    steps:
      - uses: actions/checkout@v4
      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Bun
        run: npm install -g bun
        shell: bash
      - name: Install dependencies
        run: bun install --frozen-lockfile --cache-dir ${{ env.BUN_CACHE_DIR }}
        shell: bash
      - name: Build src-tauri (WebView2 CDP enabled for E2E)
        # The CDP port is compiled into the window's additionalBrowserArgs, so
        # the overlay must be present at build time. wry overrides
        # WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS, so the env var alone never opens
        # the debug port — see scripts/e2e/tauri_cdp_overlay.ts.
        run: |
          TAURI_CONFIG="$(bun run e2e:cdp-config)"
          if [ -z "$TAURI_CONFIG" ]; then
            echo "::error::E2E CDP overlay produced no output; refusing to build a binary without the WebView2 debug port."
            exit 1
          fi
          export TAURI_CONFIG
          echo "TAURI_CONFIG=$TAURI_CONFIG"
          cd src-tauri && cargo build
        shell: bash
      - name: Run Playwright E2E tests (Windows)
        run: |
          bun run test:e2e -- runtime/auth.spec.ts runtime/backup.spec.ts runtime/ipc.spec.ts runtime/sync_fiscal.spec.ts runtime/startup.spec.ts
        shell: bash
      - name: Upload Playwright report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-windows
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
