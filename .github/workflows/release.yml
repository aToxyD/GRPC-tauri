name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name to release'
        required: true

jobs:
  build:
    name: Build release packages
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      BUN_CACHE_DIR: .bun-cache
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref_name }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Update version in config files
        run: |
          TAG_VERSION="${{ github.event.inputs.tag || github.ref_name }}"
          TAG_VERSION="${TAG_VERSION#v}"
          echo "Updating configuration files to version: $TAG_VERSION"
          
          # Update tauri.conf.json
          node -e "
            const fs = require('fs');
            const conf = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'));
            conf.version = '$TAG_VERSION';
            fs.writeFileSync('src-tauri/tauri.conf.json', JSON.stringify(conf, null, 2), 'utf8');
          "
          
          # Update Cargo.toml
          node -e "
            const fs = require('fs');
            let cargo = fs.readFileSync('src-tauri/Cargo.toml', 'utf8');
            cargo = cargo.replace(/^version\s*=\s*\"[^\"]+\"/m, 'version = \"$TAG_VERSION\"');
            fs.writeFileSync('src-tauri/Cargo.toml', cargo, 'utf8');
          "
        shell: bash
      - name: Install Bun
        run: npm install -g bun
        shell: bash
      - name: Install frontend dependencies
        run: bun install --frozen-lockfile --cache-dir ${{ env.BUN_CACHE_DIR }}
        shell: bash
      - name: Build frontend
        run: bun run build
        shell: bash
      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          components: cargo
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Build Tauri bundle
        run: bun run tauri:build
        shell: bash
      - name: Fix macOS DMG bundle script permissions
        if: runner.os == 'macOS'
        run: |
          find src-tauri/target/release/bundle -name "*.sh" -type f -exec chmod +x {} \;
        shell: bash
      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: src-tauri/target/release/bundle

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
      - name: Prepare release artifacts
        run: |
          mkdir -p release-packages
          TAG_VERSION="${{ github.event.inputs.tag || github.ref_name }}"
          TAG_VERSION="${TAG_VERSION#v}"
          echo "Target version: $TAG_VERSION"
          
          # copy only the 3 files we want (if present)
          find release-artifacts -type f -name "GRPC_${TAG_VERSION}_amd64.deb" -exec cp {} release-packages/ \; || true
          find release-artifacts -type f -name "GRPC_${TAG_VERSION}_x64-setup.exe" -exec cp {} release-packages/ \; || true
          find release-artifacts -type f -name "GRPC_${TAG_VERSION}_aarch64.dmg" -exec cp {} release-packages/ \; || true
        shell: bash
      - name: Create GitHub release and upload assets
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            release-packages/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
