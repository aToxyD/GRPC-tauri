name: Build CI image

on:
  push:
    branches:
      - main
      - 'ci-image/**'

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build and push CI image to GHCR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ghcr.io/${{ toLower(github.repository_owner) }}/${{ toLower(github.event.repository.name) }}:ci-latest
