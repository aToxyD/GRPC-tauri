name: Build CI image

on:
  push:
    branches:
      - main
      - 'ci-image/**'

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build and push CI image to GHCR
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set lowercased repository names
        id: repo_names
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO_LOWER=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')
          echo "owner_lower=${OWNER_LOWER}" >> $GITHUB_OUTPUT
          echo "repo_lower=${REPO_LOWER}" >> $GITHUB_OUTPUT
        shell: bash
      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ steps.repo_names.outputs.owner_lower }}/${{ steps.repo_names.outputs.repo_lower }}:ci-latest
