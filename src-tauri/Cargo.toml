[package]
name = "grpc"
version = "1.2.1"
description = "GRPC - Gestion des Restaurants de la Protection Civile"
authors = ["1bxm"]
license-file = "../LICENSE"
repository = ""
edition = "2021"
rust-version = "1.94.0"

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
tauri = { version = "2.10.3", features = [] }
tauri-plugin-fs = "2.5.0"
tauri-plugin-dialog = "2.7.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
rusqlite = { version = "0.39.0", features = ["bundled", "backup", "chrono", "uuid", "serialize"] }
argon2 = { version = "0.5.3", features = ["password-hash"] }
rand = { version = "0.8", features = ["std_rng", "std"] }
chrono = { version = "0.4.44", features = ["serde"] }
uuid = { version = "1.23.1", features = ["v4", "serde"] }
rust_xlsxwriter = "0.94.0"
thiserror = "2.0.18"
dirs = "6.0.0"
regex = "1.12.3"
log = "0.4.29"
fern = "0.6.2"
sha2 = "0.10.9"
hmac = "0.12.1"
subtle = "2.6.1"
tempfile = "3.27.0"
age = "0.11.3"
hex = "0.4.3"
ed25519-dalek = { version = "2.2.0", features = ["rand_core"] }
tauri-plugin-single-instance = "2.0.0"
base64 = "0.22.1"

[dev-dependencies]


[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
command-registry = []  # Reserved for future compile-time command registration

[lib]
name = "grpc_lib"
path = "src/lib.rs"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "grpc"
path = "src/main.rs"

# Offline Authority Root signing tool — signs WILAYA IdentityCertificate CSRs
# (RFC 2026-08-04-node-identity-trust / ADR-0038). Part of the grpc identity
# trust chain (NOT grpc-licensing, ADR-0004). See src/bin/root-signer.rs.
[[bin]]
name = "root-signer"
path = "src/bin/root-signer.rs"

