<!doctype html>
<html lang="ar" dir="rtl">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="/favicon.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>GRPC - نظام تسيير مطاعم قطاع الحماية المدنية</title>
		<script>
			try {
				var saved = localStorage.getItem('theme');
				var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
				// Default = dark. Only use light if explicitly saved as 'light'.
				if (saved === 'light') {
					document.documentElement.classList.remove('dark');
				} else {
					// saved === 'dark', or no preference saved → dark (system preference or default)
					document.documentElement.classList.add('dark');
				}
			} catch (_) {
				// localStorage blocked → default dark
				document.documentElement.classList.add('dark');
			}
		</script>
	</head>
	<body class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100 transition-colors duration-200">
		<div id="app"></div>
		<script type="module" src="/src/main.js"></script>
	</body>
</html>
